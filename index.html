<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Netflix Mail</title>
    <meta name="description" content="Fast, private inbox viewer for shared login codes." />

    <style>
      html,
      body,
      #root {
        min-height: 100%;
        background: #020617;
        color: #f8fafc;
      }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-shell {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 50% 30%, rgba(220, 38, 38, 0.22), transparent 32rem),
          linear-gradient(180deg, #020617 0%, #0b0f1e 50%, #020617 100%);
      }
      .boot-content { text-align: center; display: grid; gap: 22px; justify-items: center; }
      .boot-logo-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        display: grid;
        place-items: center;
      }
      .boot-logo {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #ef4444, #b91c1c);
        color: white;
        font-weight: 900;
        font-size: 32px;
        box-shadow: 0 20px 60px rgba(220, 38, 38, 0.45), inset 0 1px 0 rgba(255,255,255,0.15);
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #ef4444;
        border-right-color: rgba(239, 68, 68, 0.35);
        animation: boot-spin 1s linear infinite;
      }
      .boot-title {
        margin: 0;
        color: #ffffff;
        font-size: clamp(20px, 3vw, 26px);
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .boot-subtitle {
        margin: 0;
        color: #64748b;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      .boot-dots { display: inline-flex; gap: 6px; margin-top: 4px; }
      .boot-dots span {
        width: 6px; height: 6px; border-radius: 50%;
        background: #ef4444;
        animation: boot-bounce 1.2s ease-in-out infinite;
      }
      .boot-dots span:nth-child(2) { animation-delay: 0.15s; }
      .boot-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 20px 60px rgba(220,38,38,0.45), inset 0 1px 0 rgba(255,255,255,0.15); }
        50% { transform: scale(1.06); box-shadow: 0 24px 72px rgba(220,38,38,0.65), inset 0 1px 0 rgba(255,255,255,0.2); }
      }
      @keyframes boot-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-label="Loading">
        <section class="boot-content">
          <div class="boot-logo-wrap">
            <div class="boot-ring" aria-hidden="true"></div>
            <div class="boot-logo" aria-hidden="true">N</div>
          </div>
          <div>
            <h1 class="boot-title">Netflix Mail</h1>
            <p class="boot-subtitle">Preparing your inbox</p>
          </div>
          <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </section>
      </main>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;background:#020617;color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:24px;z-index:9999;font-family:Inter,system-ui,sans-serif;">
        <div style="max-width:480px;text-align:center;">
          <div style="width:56px;height:56px;margin:0 auto 20px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;font-weight:900;font-size:28px;">N</div>
          <h1 style="font-size:24px;margin:0 0 12px;font-weight:800;">JavaScript required</h1>
          <p style="color:#94a3b8;line-height:1.6;margin:0;">Please enable JavaScript and refresh to continue.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safe recovery: if the app hasn't mounted after 14s (blocked module, stale hashed asset,
      // antivirus interference, or offline), show a clear Refresh screen instead of an
      // infinite spinner. No cache-busting redirects, no external calls.
      (function () {
        var mounted = false;
        var mo = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && !root.querySelector('.boot-shell')) { mounted = true; mo.disconnect(); }
        });
        mo.observe(document.getElementById('root'), { childList: true, subtree: false });
        setTimeout(function () {
          if (mounted) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '<main style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:#020617;color:#f8fafc;font-family:Inter,system-ui,sans-serif"><div style="max-width:420px;text-align:center"><div style="width:64px;height:64px;margin:0 auto 20px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;font-weight:900;font-size:32px">N</div><h1 style="font-size:22px;margin:0 0 10px;font-weight:800">Couldn\u2019t load the app</h1><p style="color:#94a3b8;line-height:1.6;margin:0 0 20px;font-size:14px">Your browser or antivirus may have blocked the page script. Please refresh once. If it happens again, allow this site in your antivirus.</p><button onclick="window.location.reload()" style="background:#dc2626;color:#fff;border:0;padding:12px 22px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer">Refresh page</button></div></main>';
        }, 14000);
      })();
    </script>
  </body>

</html>
