name: TV Login SLA Test

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of runs"
        default: "3"
      sla_ms:
        description: "SLA in milliseconds (fail if any run >= this)"
        default: "10000"

jobs:
  sla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/tv-login-sla-test.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --no-save @supabase/supabase-js@2

      - name: Run SLA test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_PAT: ${{ secrets.TV_DISPATCH_PAT }}
          GITHUB_REPO: ${{ github.repository }}
          TV_TEST_USER_ID: ${{ secrets.TV_TEST_USER_ID }}
          TV_TEST_CODE: "00000000"
          ITERATIONS: ${{ inputs.iterations }}
          SLA_MS: ${{ inputs.sla_ms }}
        run: node scripts/tv-login-sla-test.mjs
