name: TV Login SLA Test

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of runs"
        default: "3"
      sla_ms:
        description: "SLA in milliseconds (fail if any run >= this)"
        default: "10000"

jobs:
  sla:
    # Pinned to ubuntu-22.04 to match .github/workflows/tv-login.yml — the
    # Playwright 1.48 Chromium cache and glibc / libnss versions on 24.04
    # differ, and mismatches were the root cause of the July 2026 silent
    # 24-second crashes. Keep both workflows on the same image.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/tv-login-sla-test.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --no-save @supabase/supabase-js@2

      - name: Run SLA test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TV_FAST_RUNNER_URL: ${{ secrets.TV_FAST_RUNNER_URL }}
          TV_TEST_USER_ID: ${{ secrets.TV_TEST_USER_ID }}
          TV_TEST_IMAP_USER: ${{ secrets.TV_TEST_IMAP_USER }}
          TV_TEST_CODE: "00000000"
          ITERATIONS: ${{ inputs.iterations }}
          SLA_MS: ${{ inputs.sla_ms }}
        run: node scripts/tv-login-sla-test.mjs
