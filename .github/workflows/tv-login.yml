name: TV Auto-Login (headless Netflix)

on:
  repository_dispatch:
    types: [tv-login]

concurrency:
  group: tv-login-${{ github.event.client_payload.event_id }}
  cancel-in-progress: false

jobs:
  run:
    # Strict sub-10s execution is not possible on GitHub-hosted runners because
    # runner allocation + browser/dependency setup regularly takes 30-60s.
    # This job intentionally targets a pre-warmed self-hosted runner with:
    #   - labels: self-hosted, tv-login-fast
    #   - Node 20+
    #   - scripts/tv-login-runner/node_modules already installed
    #   - Playwright Chromium browser already installed/cached
    runs-on: [self-hosted, tv-login-fast]
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
          sparse-checkout: scripts/tv-login-runner
          sparse-checkout-cone-mode: false

      - name: Verify prewarmed runner
        working-directory: scripts/tv-login-runner
        run: |
          node -v
          test -d node_modules/playwright || { echo "tv-login-fast runner is not prewarmed: run npm install in scripts/tv-login-runner"; exit 12; }
          node -e "import('playwright').then(async ({ chromium }) => { const b = await chromium.launch({ headless: true }); await b.close(); })"

      - name: Run TV auto-login
        working-directory: scripts/tv-login-runner
        timeout-minutes: 1
        env:
          EVENT_ID: ${{ github.event.client_payload.event_id }}
          EVENT_PATH: ${{ github.event_path }}
          TV_REPORT_URL: ${{ secrets.TV_REPORT_URL }}
          TV_REPORT_HMAC_KEY: ${{ secrets.TV_REPORT_HMAC_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TV_LOGIN_MAX_MS: 15000
        run: node tv-login.mjs
