name: TV Auto-Login (headless Netflix)

on:
  repository_dispatch:
    types: [tv-login]

concurrency:
  group: tv-login-${{ github.event.client_payload.event_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache Playwright's Chromium browser (~150MB) across runs — restore takes ~2s
      # vs a ~30s fresh download. Key includes playwright version so upgrades bust it.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.48.0-${{ runner.os }}

      - name: Cache npm deps
        uses: actions/cache@v4
        with:
          path: scripts/tv-login-runner/node_modules
          key: tv-runner-npm-${{ hashFiles('scripts/tv-login-runner/package.json') }}

      - name: Install runner deps
        working-directory: scripts/tv-login-runner
        run: |
          if [ ! -d node_modules/playwright ]; then
            npm install --no-audit --no-fund --prefer-offline --no-progress
          fi

      - name: Install Chromium (only on cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: scripts/tv-login-runner
        run: npx playwright install --with-deps chromium

      - name: Ensure system deps present (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: scripts/tv-login-runner
        run: npx playwright install-deps chromium || true

      - name: Run TV auto-login
        working-directory: scripts/tv-login-runner
        env:
          EVENT_PATH: ${{ github.event_path }}
          TV_REPORT_URL: ${{ secrets.TV_REPORT_URL }}
          TV_REPORT_HMAC_KEY: ${{ secrets.TV_REPORT_HMAC_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tv-login.mjs
