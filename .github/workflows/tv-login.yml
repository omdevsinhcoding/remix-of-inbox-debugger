name: TV Auto-Login (headless Netflix)
run-name: TV Login · ${{ github.event.client_payload.user_label || github.event.client_payload.event_id || github.event.client_payload.test_id || github.event.action }}

on:
  repository_dispatch:
    types: [tv-login, tv-login-test]

concurrency:
  group: tv-login-${{ github.event.client_payload.event_id || github.event.client_payload.test_id || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # IMPORTANT: image tag MUST match the `playwright` version in
    # scripts/tv-login-runner/package.json. Image ships with Chromium + all
    # system deps pre-baked, so we skip `npx playwright install`.
    container:
      image: mcr.microsoft.com/playwright:v1.48.0-jammy
      options: --user 1001
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: GitHub runner test
        if: github.event.action == 'tv-login-test'
        run: echo "GitHub Actions TV runner is executable. test_id=${{ github.event.client_payload.test_id }}"

      - uses: actions/checkout@v4
        if: github.event.action == 'tv-login'
        with:
          persist-credentials: false
          sparse-checkout: scripts/tv-login-runner
          sparse-checkout-cone-mode: false

      - name: Cache runner node_modules
        if: github.event.action == 'tv-login'
        uses: actions/cache@v4
        with:
          path: scripts/tv-login-runner/node_modules
          key: tv-runner-nm-${{ hashFiles('scripts/tv-login-runner/package-lock.json') }}

      - name: Install runner dependencies
        if: github.event.action == 'tv-login'
        working-directory: scripts/tv-login-runner
        env:
          # Browsers are pre-baked in the container; skip Playwright's postinstall.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          if [ -d node_modules/playwright ]; then
            echo "node_modules cache hit; skipping install"
          else
            npm ci --prefer-offline --no-audit --no-fund --ignore-scripts \
              || npm install --prefer-offline --no-audit --no-fund --ignore-scripts
          fi

      - name: Run TV auto-login
        if: github.event.action == 'tv-login'
        working-directory: scripts/tv-login-runner
        timeout-minutes: 1
        env:
          EVENT_ID: ${{ github.event.client_payload.event_id }}
          EVENT_PATH: ${{ github.event_path }}
          TV_REPORT_URL: ${{ secrets.TV_REPORT_URL }}
          TV_REPORT_HMAC_KEY: ${{ secrets.TV_REPORT_HMAC_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TV_LOGIN_MAX_MS: 25000
        run: node tv-login.mjs
