name = "netflixfetch"
main = "worker.js"
compatibility_date = "2026-04-07"

# ─────────────────────────────────────────────────────────────
# FULL AUTO SETUP
# ─────────────────────────────────────────────────────────────
# Cloudflare Workers → Create → Connect to Git:
#   Repo:            inbox-debugger
#   Branch:          main
#   Root directory:  /cloudflare-worker
#   Build command:   bash setup.sh
#   Deploy command:  (leave empty — setup.sh already deploys)
#
# setup.sh khud:
#   • KV namespace "EMAIL_CACHE" auto-create karega + bind karega
#   • SUPABASE_URL + SUPABASE_KEY secrets auto set karega
#   • Worker deploy karega
#
# SESSION_SECRET (real secret) 2 tarah se de sakte ho:
#   (a) Cloudflare Build Variable naam "SESSION_SECRET" — auto set ho jayega
#   (b) Dashboard → Worker → Variables and Secrets me manual ek baar
#
# API token needs: Workers Scripts:Edit + Workers KV Storage:Edit
# (default "Workers Builds" token me dono hote hain)
