name = "__WORKER_NAME__"
main = "worker.js"
compatibility_date = "2026-04-07"

# KV id is injected at build time from the Cloudflare account's Build Variables.
# See build.sh — it replaces __KV_ID__ using $KV_ID from the dashboard.
[[kv_namespaces]]
binding = "EMAIL_CACHE"
id = "__KV_ID__"

[vars]
# Runtime secrets (SUPABASE_URL, SUPABASE_KEY, SESSION_SECRET) live in
# Cloudflare dashboard → Worker → Settings → Variables and Secrets.
# Do NOT put them here.
