name = "netflixfetch"
main = "worker.js"
compatibility_date = "2026-04-07"

# ─────────────────────────────────────────────────────────────
# ZERO-CONFIG SETUP — KV bhi auto ban jayega
# ─────────────────────────────────────────────────────────────
# Cloudflare Workers → Create → Connect to Git:
#   Repo:            inbox-debugger
#   Branch:          main
#   Root directory:  /cloudflare-worker
#   Build command:   bash setup.sh
#   Deploy command:  npx wrangler deploy
#
# Bas itna. `setup.sh` khud check karega ki "EMAIL_CACHE" KV namespace
# is account me exist karta hai ya nahi — nahi hua to create karega,
# aur uska ID yahan neeche inject kar dega deploy se pehle.
#
# Runtime secrets (SUPABASE_URL, SUPABASE_KEY, SESSION_SECRET) ko
# Cloudflare dashboard → Worker → Settings → Variables and Secrets me
# ek baar daal do (per account).
