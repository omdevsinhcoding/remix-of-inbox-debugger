name = "netflix"
main = "worker.js"
compatibility_date = "2026-07-10"
workers_dev = true

# Source-of-truth binding. `deploy.mjs` creates/fetches this KV namespace in
# the current Cloudflare account, injects its account-specific id into a
# temporary Wrangler config, then deploys with EMAIL_CACHE correctly bound.
[[kv_namespaces]]
binding = "EMAIL_CACHE"

# ─────────────────────────────────────────────────────────────
# FULL AUTO SETUP — GitHub Connect only
# ─────────────────────────────────────────────────────────────
# Cloudflare Workers → Create → Connect to Git:
#   Repo:            inbox-debugger
#   Branch:          main
#   Root directory:  /cloudflare-worker
#   Build command:   (leave empty; if Cloudflare auto-fills npm/bun build, OK)
#   Deploy command:  npm run deploy   # safest: runs deploy.mjs KV bootstrap
#                    npx wrangler deploy also works on Wrangler 4.45+ via
#                    Cloudflare's automatic KV provisioning, but it will NOT
#                    print deploy.mjs logs like "Creating/Found EMAIL_CACHE".
#
# During deploy:
#   • deploy.mjs creates/finds KV namespace "EMAIL_CACHE" in this account
#   • deploy.mjs injects that account-specific KV id into a temp config
#   • Worker deploys with EMAIL_CACHE correctly bound
#   • Supabase public config is built into worker.js; no runtime secrets needed
#
# Cloudflare docs notes:
#   • Workers Builds default API token includes Account Settings read,
#     Workers Scripts edit, Workers KV Storage edit.
#   • Wrangler 4.45+ can deploy KV bindings without resource IDs.

# If Cloudflare auto-fills `npm run build` or `bun run build`, keep it only if
# Root directory is `/cloudflare-worker`; both scripts call `node deploy.mjs`.
# Build settings changes do not trigger immediately: Cloudflare starts only on
# Save and Deploy during import, a new push to the production branch, or manual
# Deployments → Retry/Create deployment.
