name = "netflix"
main = "worker.js"
compatibility_date = "2026-04-07"
workers_dev = true

# Source-of-truth binding. Wrangler 4.45+ automatically provisions this KV
# namespace during `wrangler deploy` if it does not exist in the connected
# Cloudflare account, so Git deploy gets a binding without manual dashboard work.
[[kv_namespaces]]
binding = "EMAIL_CACHE"

# ─────────────────────────────────────────────────────────────
# FULL AUTO SETUP — GitHub Connect only
# ─────────────────────────────────────────────────────────────
# Cloudflare Workers → Create → Connect to Git:
#   Repo:            inbox-debugger
#   Branch:          main
#   Root directory:  (blank is OK because repo root has wrangler.toml)
#                    OR /cloudflare-worker for isolated worker deploys
#   Build command:   (leave empty)
#   Deploy command:  npx wrangler deploy
#
# During deploy:
#   • KV namespace "EMAIL_CACHE" auto-provisions + binds from this file
#   • wrangler.toml deploys the worker by name
#   • Supabase public config is built into worker.js; no runtime secrets needed
#
# Cloudflare docs notes:
#   • Workers Builds default API token includes Account Settings read,
#     Workers Scripts edit, Workers KV Storage edit.
#   • Wrangler 4.45+ can deploy KV bindings without resource IDs.

# If Cloudflare auto-fills `npm run build`, clear it manually. That means it
# detected the root React app instead of this Worker config. The deploy command
# must remain `npx wrangler deploy`.
